name: 칼럼 요청
description: 읽고 싶은 주제를 올려주세요. 선별 후 자정 파이프라인이 칼럼으로 발행해 배포합니다.
body:
  - type: textarea
    id: topic
    attributes:
      label: 주제
      description: 한 줄이면 충분합니다. 풍부하게 다듬고 구성하는 것은 발행 파이프라인의 몫입니다.
      placeholder: "예) 데이터베이스 인덱스는 어떻게 동작하나"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경 (선택)
      description: 어떤 상황에서 궁금해진 주제인지 적어 주세요. 있으면 칼럼이 더 실무에 가까워집니다.
      placeholder: "예) 쿼리가 느려서 인덱스를 붙였는데도 여전히 느리다."

name: 새 호 아이디어
description: 대충 적어도 됩니다 — 자정 발간 파이프라인이 데일리 호로 만들어 배포합니다.
labels: [publish]
body:
  - type: textarea
    id: topic
    attributes:
      label: 주제
      description: 한 줄이면 충분합니다. 풍부하게 다듬고 분류하는 것은 파이프라인의 몫입니다.
      placeholder: "예) MSA에 대한 내용"
    validations:
      required: true
  - type: textarea
    id: memo
    attributes:
      label: 메모 (선택)
      description: 오늘 실무에서 막힌 부분, 궁금한 점, 읽던 문서 등 아무거나. 적어 두면 발간 품질이 올라갑니다.
      placeholder: "예) 오늘 레거시 모놀리스 서비스 분리 얘기가 나왔다. 어디부터 자르는 게 맞는지 모르겠다."
